name: Publish NuGet package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore
        run: dotnet restore Codemap.slnx

      - name: Build
        run: dotnet build Codemap.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test --solution Codemap.slnx --no-build --configuration Release

      - name: Pack CLI tool
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            dotnet pack src/Codemap.Cli/Codemap.Cli.csproj \
              --no-build \
              --configuration Release \
              --output ./artifacts/packages \
              -p:PackageVersion="$version"
          else
            dotnet pack src/Codemap.Cli/Codemap.Cli.csproj \
              --no-build \
              --configuration Release \
              --output ./artifacts/packages
          fi

      - name: Authenticate with NuGet
        id: nuget-login
        uses: NuGet/login@v1

      - name: Publish package
        run: dotnet nuget push ./artifacts/packages/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate