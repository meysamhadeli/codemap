name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
change-template: '- $TITLE @$AUTHOR'
change-title-escapes: '\<*_&'

header: |
  ## What Changed 👀

template: |
  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
      - 'fix'
  - title: '♻️ Refactor'
    labels:
      - 'refactor'
  - title: '🧰 Maintenance'
    labels:
      - 'chore'
      - 'dependencies'
      - 'deps'
  - title: '📝 Other changes'
    labels:
      - '*'

version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'minor'
      - 'feature'
  patch:
    labels:
      - 'patch'
      - 'bug'
      - 'fix'
  default: patch

exclude-labels:
  - 'skip-changelog'
  - 'duplicate'
  - 'invalid'
  - 'question'

autolabeler:
  - label: 'feature'
    branch:
      - '/^(feat|feature)\\/.*/'
  - label: 'bug'
    branch:
      - '/^(fix|bug)\\/.*/'
  - label: 'documentation'
    branch:
      - '/^(docs|documentation)\\/.*/'
  - label: 'test'
    branch:
      - '/^test\\/.*/'
  - label: 'refactor'
    branch:
      - '/^refactor\\/.*/'
  - label: 'ci'
    branch:
      - '/^(ci|build)\\/.*/'
  - label: 'security'
    branch:
      - '/^security\\/.*/'
  - label: 'minor'
    branch:
      - '/^(feat|feature)\\/.*/'
  - label: 'patch'
    branch:
      - '/^(fix|bug)\\/.*/'
