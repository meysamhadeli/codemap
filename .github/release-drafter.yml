name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'

header: |
  ## Codemap $RESOLVED_VERSION

  Codemap packages repositories into focused context for AI tools and developers.

  Install or update the CLI tool:

  ```bash
  dotnet tool install --global Codemap.Cli --version $RESOLVED_VERSION
  ```

template: |
  $CHANGES

  ## Installation

  ```bash
  dotnet tool install --global Codemap.Cli --version $RESOLVED_VERSION
  ```

  ## Links

  - [NuGet package](https://www.nuget.org/packages/Codemap.Cli/$RESOLVED_VERSION)
  - [Full changelog](https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION)

categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
      - 'fix'
  - title: '🛡️ Security'
    labels:
      - 'security'
  - title: '📚 Documentation'
    labels:
      - 'documentation'
      - 'docs'
  - title: '🧪 Tests'
    labels:
      - 'test'
      - 'testing'
  - title: '🔧 Maintenance'
    labels:
      - 'chore'
      - 'dependencies'
      - 'deps'
      - 'refactor'
  - title: '⚙️ CI'
    labels:
      - 'ci'

version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'minor'
      - 'feature'
  patch:
    labels:
      - 'patch'
      - 'bug'
      - 'fix'
  default: patch

exclude-labels:
  - 'skip-changelog'
  - 'duplicate'
  - 'invalid'
  - 'question'

autolabeler:
  - label: 'feature'
    branch:
      - '/^(feat|feature)\\/.*/'
  - label: 'bug'
    branch:
      - '/^(fix|bug)\\/.*/'
  - label: 'documentation'
    branch:
      - '/^(docs|documentation)\\/.*/'
  - label: 'test'
    branch:
      - '/^test\\/.*/'
  - label: 'refactor'
    branch:
      - '/^refactor\\/.*/'
  - label: 'ci'
    branch:
      - '/^(ci|build)\\/.*/'
  - label: 'security'
    branch:
      - '/^security\\/.*/'
  - label: 'minor'
    branch:
      - '/^(feat|feature)\\/.*/'
  - label: 'patch'
    branch:
      - '/^(fix|bug)\\/.*/'
